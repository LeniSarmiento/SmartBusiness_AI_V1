name: Deploy Azure (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check required configuration
        run: |
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_CONTAINER_APP"
          test -n "$AZURE_MIGRATION_JOB"
          test -n "$AZURE_ACR_NAME"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable images
        run: |
          az acr login --name "$AZURE_ACR_NAME"
          REGISTRY=$(az acr show --name "$AZURE_ACR_NAME" --query loginServer -o tsv)
          API_IMAGE="$REGISTRY/smartbusiness-api:$GITHUB_SHA"
          WEB_IMAGE="$REGISTRY/smartbusiness-web:$GITHUB_SHA"
          docker build --target app -t "$API_IMAGE" .
          docker build --target web -t "$WEB_IMAGE" .
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"
      - name: Migrate and update one multi-container revision
        run: node infra/azure/deploy.mjs
