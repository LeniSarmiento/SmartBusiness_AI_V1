name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartbusiness_test
          POSTGRES_USER: smartbusiness
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartbusiness -d smartbusiness_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: smartbusiness_test
      DB_USERNAME: smartbusiness
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, mbstring, bcmath, dom, xml
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: composer audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare Docker environment
        run: |
          cp .env.example .env
          APP_KEY_VALUE="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY_VALUE}|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-only-password|" .env
          sed -i "s|^APP_DEBUG=.*|APP_DEBUG=false|" .env
      - name: Build and start complete stack
        run: |
          docker compose -p smartbusiness-ci build
          docker compose -p smartbusiness-ci up -d --wait database
          docker compose -p smartbusiness-ci run --rm api php artisan migrate --seed --force
          docker compose -p smartbusiness-ci run --rm api php artisan db:seed --class=DemoSeeder --force
          docker compose -p smartbusiness-ci up -d --wait --wait-timeout 180
      - name: Verify services, HTTP and queue
        shell: pwsh
        run: ./scripts/docker-smoke.ps1 -ProjectName smartbusiness-ci -Port 8080 -Recreate
      - name: Performance smoke test
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/tests/Performance/k6:/scripts:ro" \
            --env BASE_URL=http://127.0.0.1:8080 \
            --env APP_ORIGIN=http://localhost:8080 \
            --env LOAD_TEST_EMAIL=demo@smartbusiness.test \
            --env 'LOAD_TEST_PASSWORD=SmartBusiness2026!' \
            --env K6_VUS=1 \
            --env K6_DURATION=5s \
            grafana/k6:2.3.0 run /scripts/smoke.js
      - name: Show container logs on failure
        if: failure()
        run: docker compose -p smartbusiness-ci logs --tail 150
      - name: Remove CI stack
        if: always()
        run: docker compose -p smartbusiness-ci down -v
